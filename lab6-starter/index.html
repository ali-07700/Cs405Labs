<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>CS405 Lab 6 — NPR post-processing in Three.js / TSL</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #222; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #panel { position: fixed; left: 12px; top: 12px; background: rgba(255,253,248,.93); color: #1d1b18; border-radius: 8px; padding: 10px 14px; font-size: 13px; line-height: 1.9; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  #panel label { display: flex; align-items: center; gap: 8px; } #panel input[type=range] { width: 140px; } #panel select { font: inherit; }
  #panel .v { font-family: Menlo, Consolas, monospace; min-width: 34px; }
  #info { position: fixed; left: 12px; bottom: 10px; color: #fff; background: rgba(0,0,0,.55); padding: 4px 8px; border-radius: 4px; font-size: 12px; font-family: Menlo, Consolas, monospace; }
</style>
<!-- three.js r187 is in ./vendor (no internet needed). The import map tells the browser where 'three' is. -->
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.webgpu.js",
    "three/webgpu": "./vendor/three.webgpu.js",
    "three/tsl": "./vendor/three.tsl.js",
    "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<div id="panel">
  <b>CS405 · Lab 6</b> — keys <b>0</b>–<b>8</b> choose the effect<br>
  <label>effect <select id="effect"></select></label>
  <label>split <input id="split" type="range" min="0" max="1" step="0.01" value="0.5"><span class="v" id="splitV"></span></label>
  <label>levels (2) <input id="levels" type="range" min="2" max="8" step="1" value="4"><span class="v" id="levelsV"></span></label>
  <label>line spacing (6, 8) <input id="spacing" type="range" min="3" max="12" step="1" value="6"><span class="v" id="spacingV"></span></label>
  <label>edge threshold (3, 4, 8) <input id="threshold" type="range" min="0.01" max="0.3" step="0.01" value="0.06"><span class="v" id="thresholdV"></span></label>
  <label>Kuwahara radius (7) <input id="radius" type="range" min="1" max="6" step="1" value="3"><span class="v" id="radiusV"></span></label>
</div>
<div id="info"></div>
<script type="module" src="main.js"></script>
</body>
</html>
